<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f0d4c4">
<title>Para Monica Jean · Feliz Día Mamá</title>
<meta property="og:title" content="Para Monica Jean · Feliz Día de la Madre">
<meta property="og:description" content="Una tarjeta para la mejor mamá del mundo, de Andy y PauPau.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:        #fbf3e7;
    --cream-deep:   #f0e0c8;
    --rose-soft:    #f4b8b8;
    --rose:         #c47b85;
    --rose-deep:    #8c3a4a;
    --burgundy:     #5a1f2c;
    --gold:         #b8893a;
    --gold-light:   #d4af6a;
    --ink:          #3a1f24;
    --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
    --ease-pop:     cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: clip;
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
    position: relative;
  }
  html { scroll-behavior: smooth; }
  body { min-height: 100dvh; }

  body {
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, #fbeee0 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, #d8a0a8 0%, transparent 70%),
      linear-gradient(180deg, #fbeee0 0%, #f0d4c4 50%, #d8a0a8 100%);
    background-attachment: fixed;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.3 0 0 0 0 0.15 0 0 0 0 0.2 0 0 0 0.18 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.55;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(90, 31, 44, 0.28) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .floaters {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }

  .floater {
    position: absolute;
    top: -40px;
    opacity: 0;
    animation: fall linear infinite;
    filter: drop-shadow(0 2px 3px rgba(140, 58, 74, 0.18));
    will-change: transform, opacity;
  }
  .floater--petal {
    width: 14px; height: 18px;
    background: linear-gradient(135deg, #f7c2c2 0%, #c47b85 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .floater--petal-light {
    width: 14px; height: 18px;
    background: linear-gradient(135deg, #fde0e0 0%, #f4a3a8 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .floater--heart  { width: 16px; height: 14px; color: var(--rose-deep); }
  .floater--cup    { width: 22px; height: 22px; color: #b86570; }
  .floater--puzzle { width: 22px; height: 22px; color: var(--gold); opacity: 0.85; }
  .floater svg { width: 100%; height: 100%; display: block; }

  @keyframes fall {
    0%   { transform: translate3d(0,-50px,0) rotate(0deg);   opacity: 0; }
    8%   { opacity: 0.85; }
    92%  { opacity: 0.55; }
    100% { transform: translate3d(var(--drift,40px),110vh,0) rotate(720deg); opacity: 0; }
  }

  main.card {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    padding: 0 clamp(18px, 5vw, 32px) 80px;
    text-align: center;
  }

  /* Scroll rhythm */
  section {
    width: 100%;
    padding-block: clamp(36px, 9vh, 80px);
  }
  .hero { padding-top: clamp(48px, 10vh, 90px); }

  /* ── Hero ──────────────────────────────────────── */
  .eyebrow {
    font-family: 'Cormorant SC', serif;
    font-weight: 500;
    font-size: clamp(9px, 2.6vw, 11px);
    letter-spacing: clamp(0.22em, 1vw, 0.42em);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 3vw, 14px);
    margin-bottom: clamp(32px, 7vh, 48px);
    white-space: nowrap;
  }
  .eyebrow::before, .eyebrow::after {
    content: '';
    flex: 0 1 clamp(20px, 8vw, 36px);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .greeting-script {
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: clamp(44px, 12vw, 64px);
    color: var(--rose-deep);
    line-height: 1;
    margin-bottom: 4px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  .greeting-name {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(68px, 20vw, 102px);
    color: var(--burgundy);
    line-height: 1;
    letter-spacing: -0.03em;
    margin-bottom: 14px;
    text-shadow:
      0 1px 0 rgba(255,255,255,0.5),
      0 8px 24px rgba(90,31,44,0.25);
  }

  .greeting-name-script {
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(28px, 7vw, 38px);
    color: var(--rose);
    line-height: 1;
    margin-bottom: clamp(28px, 5vh, 36px);
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .divider .line {
    height: 1px;
    width: clamp(48px, 14vw, 72px);
    background: linear-gradient(90deg, transparent, var(--rose-deep), transparent);
  }
  .divider .heart {
    color: var(--rose-deep);
    font-size: 12px;
  }

  /* ── Personal message ──────────────────────────── */
  .intro {
    font-style: italic;
    font-size: clamp(17px, 4.4vw, 21px);
    font-weight: 400;
    color: var(--burgundy);
    line-height: 1.55;
  }
  .intro-line {
    display: block;
    margin-bottom: 4px;
  }
  .intro-icon {
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-right: 6px;
    color: var(--rose-deep);
    vertical-align: -3px;
  }
  .intro-icon svg { width: 100%; height: 100%; display: block; }

  /* ── Voucher ───────────────────────────────────── */
  .voucher {
    position: relative;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.6), transparent 50%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
    padding: clamp(38px, 7vh, 48px) clamp(20px, 5vw, 28px) clamp(32px, 6vh, 40px);
    margin: 0 auto;
    width: 100%;
    max-width: 420px;
    border: 1.5px solid var(--gold);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 0 0 5px var(--cream),
      0 0 0 6px var(--gold-light),
      0 30px 60px -20px rgba(90, 31, 44, 0.5),
      0 12px 24px -12px rgba(90, 31, 44, 0.35);
  }
  .voucher::before {
    content: '';
    position: absolute;
    inset: 9px;
    border: 1px dashed var(--gold);
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 22px; height: 22px;
    border: 2px solid var(--gold);
    pointer-events: none;
  }
  .corner.tl { top: -2px; left:  -2px;  border-right: none; border-bottom: none; }
  .corner.tr { top: -2px; right: -2px;  border-left:  none; border-bottom: none; }
  .corner.bl { bottom: -2px; left:  -2px; border-right: none; border-top: none; }
  .corner.br { bottom: -2px; right: -2px; border-left:  none; border-top: none; }

  .voucher__label {
    font-family: 'Cormorant SC', serif;
    font-size: clamp(11px, 3vw, 12px);
    letter-spacing: 0.4em;
    color: var(--gold);
    margin-bottom: 18px;
    font-weight: 600;
  }
  .voucher__gift {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(24px, 6.8vw, 32px);
    line-height: 1.1;
    color: var(--burgundy);
    margin-bottom: 22px;
    letter-spacing: -0.01em;
  }
  .voucher__sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(12px, 3.4vw, 14.5px);
    color: var(--rose-deep);
    font-weight: 400;
    line-height: 1.35;
    margin-bottom: 8px;
  }
  .voucher__sub-tag {
    font-family: 'Cormorant SC', serif;
    font-size: clamp(8px, 2.2vw, 9.5px);
    letter-spacing: 0.32em;
    color: var(--rose);
    font-weight: 500;
  }
  .stamp {
    position: absolute;
    top: -8px;
    right: -4px;
    width: clamp(64px, 17vw, 82px);
    height: clamp(64px, 17vw, 82px);
    border-radius: 50%;
    border: 2.5px solid var(--rose-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant SC', serif;
    font-weight: 600;
    font-size: clamp(11px, 3vw, 13px);
    letter-spacing: 0.18em;
    color: var(--rose-deep);
    text-align: center;
    line-height: 1.2;
    background: rgba(245, 232, 212, 0.35);
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    filter: drop-shadow(0 4px 6px rgba(90,31,44,0.2));
    transform: rotate(15deg);
    opacity: 0.95;
  }
  .stamp::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid var(--rose-deep);
    border-radius: 50%;
    opacity: 0.7;
  }

  /* ── Signature ─────────────────────────────────── */
  .signature-pre {
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--rose);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .signature-script {
    font-family: 'Pinyon Script', cursive;
    font-size: clamp(36px, 9vw, 46px);
    color: var(--rose-deep);
    line-height: 1;
  }
  .replay {
    margin-top: clamp(28px, 5vh, 40px);
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--burgundy);
    font-family: 'Cormorant SC', serif;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.4em;
    padding: 11px 24px;
    cursor: pointer;
    transition: all 0.4s ease;
  }
  .replay:hover, .replay:active {
    background: var(--gold);
    color: white;
    transform: translateY(-1px);
  }

  /* ── Hero load animations ──────────────────────── */
  .hero > * {
    opacity: 0;
    transform: translateY(14px);
    animation: heroIn 1s var(--ease-out) forwards;
    animation-delay: var(--d, 0s);
  }
  .hero .greeting-name {
    transform: scale(0.86);
    animation-name: heroStamp;
    animation-timing-function: var(--ease-pop);
  }
  @keyframes heroIn  { to { opacity: 1; transform: translateY(0); } }
  @keyframes heroStamp { to { opacity: 1; transform: scale(1); } }

  /* ── Scroll-progressive reveals ────────────────── */
  .reveal {
    opacity: 0;
    transform: translateY(36px);
    transition: opacity 1.1s var(--ease-out), transform 1.1s var(--ease-out);
  }
  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  .reveal .stagger {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out);
    transition-delay: var(--sd, 0s);
  }
  .reveal.is-visible .stagger {
    opacity: 1;
    transform: translateY(0);
  }
  .voucher-section .voucher {
    opacity: 0;
    transform: translateY(50px) rotate(-4deg) scale(0.94);
    transition: opacity 1.3s var(--ease-out), transform 1.3s var(--ease-pop);
  }
  .voucher-section.is-visible .voucher {
    opacity: 1;
    transform: translateY(0) rotate(-1.5deg) scale(1);
  }
  .voucher-section .stamp {
    opacity: 0;
    transform: rotate(35deg) scale(2.2);
  }
  .voucher-section.is-visible .stamp {
    animation: stampDown 0.55s var(--ease-pop) 0.7s forwards;
  }
  @keyframes stampDown {
    0%   { opacity: 0;    transform: rotate(35deg) scale(2.2); }
    60%  { opacity: 1;    transform: rotate(13deg) scale(0.92); }
    100% { opacity: 0.95; transform: rotate(15deg) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .floater { display: none; }
    .reveal, .reveal .stagger,
    .voucher-section .voucher, .voucher-section .stamp,
    .hero > * { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-heart" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6.5 5c2 0 3.5 1 4 2.5C12 6 13.5 5 15.5 5c4 0 5.5 4 4 7-2.5 4.5-9.5 9-9.5 9z"/>
    </symbol>
    <symbol id="i-cup" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h12v5.5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/>
        <path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"/>
        <path d="M4 19.5h13"/>
        <path d="M7.5 4.5c.4 1 0 1.5 0 2.5s.4 1.5 0 2"/>
        <path d="M11 4.5c.4 1 0 1.5 0 2.5s.4 1.5 0 2"/>
      </g>
    </symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24">
      <path fill="currentColor" d="M10.4 3a1.6 1.6 0 0 1 3.2 0c0 .35.05.7.18 1H17a1.5 1.5 0 0 1 1.5 1.5v3.22c.3-.13.65-.18 1-.18a1.6 1.6 0 0 1 0 3.2c-.35 0-.7.05-1 .18V15.5A1.5 1.5 0 0 1 17 17h-3.22c.13.3.18.65.18 1a1.6 1.6 0 0 1-3.2 0c0-.35-.05-.7-.18-1H7.5A1.5 1.5 0 0 1 6 15.5v-3.22c-.3.13-.65.18-1 .18a1.6 1.6 0 0 1 0-3.2c.35 0 .7-.05 1-.18V5.5A1.5 1.5 0 0 1 7.5 4h3.72c-.13-.3-.18-.65-.18-1z"/>
    </symbol>
  </defs>
</svg>

<div class="floaters" id="floaters" aria-hidden="true"></div>

<main class="card">
  <section class="hero">
    <p class="eyebrow" style="--d:.15s">DÍA DE LA MADRE · 2026</p>
    <h2 class="greeting-script" style="--d:.45s">Feliz día,</h2>
    <h1 class="greeting-name" style="--d:.95s">Mamá</h1>
    <p class="greeting-name-script" style="--d:1.5s">Monica Jean</p>
    <div class="divider" aria-hidden="true" style="--d:1.85s">
      <span class="line"></span>
      <span class="heart">♥</span>
      <span class="line"></span>
    </div>
  </section>

  <section class="message reveal">
    <p class="intro">
      <span class="intro-line stagger" style="--sd:0s">Para la mejor madre del mundo —</span>
      <span class="intro-line stagger" style="--sd:.25s">
        <span class="intro-icon"><svg><use href="#i-heart"/></svg></span>la única que nos aguanta a Andy y a PauPau.
      </span>
    </p>
  </section>

  <section class="voucher-section reveal">
    <div class="voucher">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <p class="voucher__label">— VALE POR —</p>
      <p class="voucher__gift">El mejor compañero<br>de cuarto</p>
      <p class="voucher__sub">Presente disponible en VargasG<br>para retiro</p>
      <p class="voucher__sub-tag">— SIN VENCIMIENTO —</p>

      <div class="stamp" aria-hidden="true">CON<br>AMOR</div>
    </div>
  </section>

  <section class="signature-section reveal">
    <p class="signature-pre stagger" style="--sd:0s">— TUS HIJOS —</p>
    <p class="signature-script stagger" style="--sd:.25s">Andy y PauPau</p>
    <div class="stagger" style="--sd:.5s">
      <button class="replay" onclick="location.reload()">VOLVER A VER</button>
    </div>
  </section>
</main>

<script>
  (function () {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const container = document.getElementById('floaters');

    if (container && !reduceMotion) {
      const TYPES = [
        { cls: 'floater--petal',       count: 9 },
        { cls: 'floater--petal-light', count: 6 },
        { cls: 'floater--heart',       count: 4, sym: 'i-heart' },
        { cls: 'floater--cup',         count: 3, sym: 'i-cup' },
        { cls: 'floater--puzzle',      count: 3, sym: 'i-puzzle' },
      ];
      const fragment = document.createDocumentFragment();
      TYPES.forEach(({ cls, count, sym }) => {
        for (let i = 0; i < count; i++) {
          const el = document.createElement('span');
          el.className = 'floater ' + cls;
          el.style.left = (Math.random() * 100) + '%';
          el.style.animationDuration = (9 + Math.random() * 10) + 's';
          el.style.animationDelay = (Math.random() * 14) + 's';
          el.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
          const scale = 0.55 + Math.random() * 0.85;
          if (sym) {
            el.innerHTML = '<svg><use href="#' + sym + '"/></svg>';
            const baseSize = cls === 'floater--heart' ? 16 : 22;
            el.style.width = (baseSize * scale) + 'px';
            el.style.height = (baseSize * scale) + 'px';
          } else {
            el.style.width = (14 * scale) + 'px';
            el.style.height = (18 * scale) + 'px';
          }
          fragment.appendChild(el);
        }
      });
      container.appendChild(fragment);
    }

    const targets = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window) || reduceMotion) {
      targets.forEach(t => t.classList.add('is-visible'));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.18, rootMargin: '0px 0px -8% 0px' });
    targets.forEach(t => io.observe(t));
  })();
</script>

</body>
</html>
